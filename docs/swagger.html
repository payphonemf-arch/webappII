<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Northwind BMS API · Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>body{margin:0;background:#fafbfe}.swagger-ui .topbar{display:none}.swagger-ui .info{margin:28px 0}.swagger-ui .scheme-container{padding:18px 0;box-shadow:none}</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>window.onload=()=>SwaggerUIBundle({url:'openapi.yaml',dom_id:'#swagger-ui',deepLinking:true,displayRequestDuration:true,presets:[SwaggerUIBundle.presets.apis],layout:'BaseLayout'});</script>
</body>
</html>
